name: GitHub Stats

# Gera os cards de estatísticas e de linguagens uma vez por dia e salva em
# stats/. Se a geração falhar, os SVGs anteriores continuam no README.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/github-stats.yml
      - .github/scripts/gerar-stats.mjs

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: AlexandreRibeiro1/github-readme-stats
          path: grs

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --omit=dev --ignore-scripts
        working-directory: grs

      - name: Gerar cards
        run: |
          if [ -z "$PAT_1" ]; then
            echo "::error::Crie o segredo STATS_TOKEN (token clássico sem escopos e sem expiração). Veja .github/scripts/gerar-stats.mjs"
            exit 1
          fi
          node .github/scripts/gerar-stats.mjs
        env:
          # O GITHUB_TOKEN do Actions não serve: ele só enxerga este repositório
          # e o GitHub bloqueia a leitura de estrelas dos outros repositórios.
          PAT_1: ${{ secrets.STATS_TOKEN }}

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats/
          if git diff --cached --quiet; then
            echo "Cards sem mudanças."
          else
            git commit -m "Atualiza GitHub Stats"
            git push
          fi
